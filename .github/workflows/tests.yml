name: tests
on: [push]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install python deps
        run: pip install pytest numpy qrcode
      - name: install age (crypto tests)
        run: |
          mkdir -p vendor
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar xz -C /tmp
          cp /tmp/age/age /tmp/age/age-keygen vendor/
          chmod +x vendor/age vendor/age-keygen
      - name: run tests
        run: python3 -m pytest tests/ -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: gradle unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
