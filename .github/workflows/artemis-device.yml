name: artemis-device-test
# Manual-only: drives the debug APK on an emulated Pixel with Google's ARTEMIS
# (github.com/google/artemis, natural-language Android automation). Needs the
# GEMINI_API_KEY repo secret (Google AI Studio key) - the runner sends emulator
# screenshots and the UI tree to the Gemini API. Test data only, never real notes.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Natural-language test goal for Artemis
        default: "Open the Iris app, grant any permission dialogs, tap START RECORDING, wait 10 seconds, tap STOP RECORDING, and confirm the status text confirms the recording was saved locally (for example saved meeting-...). The recordings list is for synced meetings and stays empty on a fresh offline install - do not treat an empty list as a failure. Report any crash dialog."
jobs:
  device-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: astral-sh/setup-uv@v5
      - name: enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm trigger --name-match=kvm
      - name: install scrcpy (best-effort, for Artemis screen videos)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq scrcpy || true
      - name: drive Iris with Artemis on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Hassan's AI Studio project is verified free tier (no billing account);
          # over-quota calls 429, never bill. Live probe 2026-10-24: this key 404s
          # gemini-2.5-flash/-lite ("no longer available to new users") and 3.8-flash
          # was 503/20-RPD-tight; gemini-3-flash-preview + gemini-3.5-flash-lite
          # returned 200 on a 1-token generation probe, so pin those.
          ARTEMIS_DEFAULT_MODEL: gemini-3-flash-preview
          EVENTS_OUTPUT_PATH: /tmp/artemis-out/events.jsonl
          RESULTS_OUTPUT_PATH: /tmp/artemis-out/results
          ARTEMIS_DEBUG: "true"
          KEEP_VIDEOS: "true"
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # the emulator lives only for this step, so install and test happen here
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            git clone --depth 1 https://github.com/google/artemis.git /tmp/artemis
            # NOTE: each script line is its own sh -c; cd does not persist. One line.
            # The jsonc config (not env) drives the flash runner's model; pin models
            # verified usable by this key via a live 1-token probe (200 OK) on
            # 2026-10-24. Keep the jsonc default lens gemini-3.5-flash-lite (probed OK).
            cd /tmp/artemis && sed -i 's/gemini-3\.8-flash-lite/gemini-3.5-flash-lite/g; s/gemini-3\.8-flash/gemini-3-flash-preview/g; s/gemini-3\.7-flash/gemini-3-flash-preview/g; s/gemini-3\.1-flash-lite/gemini-3.5-flash-lite/g' config/artemis.jsonc && grep -o 'gemini-[a-z0-9.-]*' config/artemis.jsonc | sort -u && uv run artemis run "${{ github.event.inputs.scenario }}" --profile flash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artemis-trace
          path: |
            /tmp/artemis/traces
            /tmp/artemis-out
          retention-days: 7
          if-no-files-found: ignore
