name: release-apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: build debug-signed APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk iris-${GITHUB_REF_NAME}.apk
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" "iris-${GITHUB_REF_NAME}.apk" --title "Iris $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md || gh release upload "$GITHUB_REF_NAME" "iris-${GITHUB_REF_NAME}.apk" --clobber
      - uses: actions/upload-artifact@v4
        with: { name: iris-apk, path: "*.apk" }
