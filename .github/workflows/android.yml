name: android-build
on: [push]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: build debug and unsigned release APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with: { name: iris-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 7 }
